<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="masthead">
  <div class="toolbar">
    <span class="brand">Cabinet Explorer</span>
    <nav class="views" aria-label="View">
      <a href="departments.html" data-view-link="departments.html">Departments</a>
      <a href="index.html" data-view-link="index.html" aria-current="page">Offices</a>
    </nav>
    <label class="toggle" title="Show Wikidata QIDs next to offices and officeholders">
      <input type="checkbox" id="debugToggle"> Show QIDs
    </label>
    <button type="button" class="btn" id="loginToggle">Log in with Wikimedia</button>
  </div>

  <h1 class="headline">
    Government of
    <select class="headline-control" id="countrySelect" aria-label="Country"></select>
    on
    <input type="date" class="headline-control" id="dateInput" aria-label="Date">
  </h1>
  <p class="cabinet" id="yearLabel"></p>

  <div class="timeline">
    <span class="timeline-end">1900</span>
    <input type="range" step="1" id="yearSlider" aria-label="Move through time">
    <span class="timeline-end">Today</span>
  </div>
</header>

<main class="content" id="contentArea">
  <section class="leads" id="hero" aria-label="Heads of state and government"></section>

  <section class="offices">
    <div class="offices-head">
      <h2>Offices <span class="count" id="officeCount"></span></h2>
      <button type="button" class="btn" id="addOfficeBtn">Add office</button>
    </div>
    <p class="status-line" id="hint"></p>
    <ul class="office-list" id="deptGrid"></ul>
  </section>

  <div class="loading" id="loadingOverlay" role="status">
    <div class="spinner"></div>
    <p>Loading offices from Wikidata. The first load for a country can take up to a minute.</p>
  </div>
</main>

<footer class="site-footer">
  WikiGovTool <span id="versionInfo"></span>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
